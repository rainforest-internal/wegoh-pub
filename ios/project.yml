name: WegoH
options:
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  defaultSourceDirectoryType: syncedFolder
packages:
  KakaoMapsSDK-SPM:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM.git
    exactVersion: 2.12.19
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WegoH:
    type: application
    platform: iOS
    sources: [WegoH]
    dependencies:
      - package: KakaoMapsSDK-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wegoh.iphone
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: WegoH/WegoH.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        INFOPLIST_KEY_CFBundleDisplayName: WegoH
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "여행 상세 화면을 보는 동안 현재 위치를 여행 일행에게 보여 줍니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "여행 중 워키토키 버튼을 누르고 있는 동안 내 목소리를 일행에게 보냅니다."
        INFOPLIST_KEY_NSCameraUsageDescription: "차량 화면의 QR 코드를 스캔할 때 카메라를 사용합니다."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  WegoHTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WegoHTests]
    dependencies:
      - target: WegoH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wegoh.iphone.tests
        TARGETED_DEVICE_FAMILY: "1"
  WegoHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WegoHUITests]
    dependencies:
      - target: WegoH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wegoh.iphone.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: WegoH
schemes:
  WegoH:
    build:
      targets:
        WegoH: all
    test:
      targets: [WegoHTests, WegoHUITests]
